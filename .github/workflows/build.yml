name: C/C++ CI

on:
  push:
    branches: [ main, task3-structures ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Install build tools
      run: sudo apt-get update && sudo apt-get install -y build-essential
      
    - name: Build with Make
      run: make
      
    - name: Run tests
      run: make run
